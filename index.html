<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер задач • Task Tracker</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 min-h-screen text-zinc-900 dark:text-zinc-100">
    
    <!-- Header -->
    <header class="bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-5">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-x-3">
                    <!-- Logo -->
                    <div class="flex items-center justify-center w-11 h-11 bg-indigo-600 rounded-2xl shadow-inner">
                        <i class="fa-solid fa-check-double text-white text-3xl"></i>
                    </div>
                    <div>
                        <h1 class="font-display text-3xl font-bold tracking-tighter">Трекер задач</h1>
                        <p class="text-xs text-zinc-500 dark:text-zinc-400 -mt-1">Организуй свой день</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-x-2">
                    <!-- Progress -->
                    <div class="hidden md:flex items-center gap-x-3 bg-zinc-100 dark:bg-zinc-800 rounded-3xl px-4 py-2 text-sm">
                        <div class="flex items-center gap-x-2">
                            <div class="w-28 h-2 bg-zinc-200 dark:bg-zinc-700 rounded-full overflow-hidden">
                                <div id="progress-bar" 
                                     class="h-2 bg-gradient-to-r from-indigo-500 to-violet-500 rounded-full transition-all duration-300"
                                     style="width: 0%"></div>
                            </div>
                            <span id="progress-text" class="font-mono text-xs font-semibold text-zinc-600 dark:text-zinc-300 w-12 text-right">0/0</span>
                        </div>
                    </div>

                    <!-- Export -->
                    <button onclick="exportTasks()" 
                            class="flex items-center gap-x-2 px-4 py-2 text-sm font-medium text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-2xl transition-colors border border-zinc-200 dark:border-zinc-700">
                        <i class="fa-solid fa-download"></i>
                        <span class="hidden lg:inline">Экспорт</span>
                    </button>

                    <!-- Import -->
                    <label class="flex items-center gap-x-2 px-4 py-2 text-sm font-medium text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-2xl transition-colors border border-zinc-200 dark:border-zinc-700 cursor-pointer">
                        <i class="fa-solid fa-upload"></i>
                        <span class="hidden lg:inline">Импорт</span>
                        <input type="file" id="import-file" accept=".json" class="hidden" onchange="importTasks(event)">
                    </label>

                    <!-- Dark Mode Toggle -->
                    <button onclick="toggleDarkMode()" id="dark-mode-btn"
                            class="w-10 h-10 flex items-center justify-center text-zinc-500 hover:text-zinc-700 dark:text-zinc-400 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-2xl transition-colors border border-zinc-200 dark:border-zinc-700">
                        <i class="fa-solid fa-moon text-lg" id="dark-icon"></i>
                    </button>

                    <!-- Clear completed -->
                    <button onclick="clearCompleted()" 
                            class="flex items-center gap-x-2 px-4 py-2 text-sm font-medium text-red-500 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-2xl transition-colors">
                        <i class="fa-solid fa-trash-can"></i>
                        <span class="hidden md:inline">Очистить</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-5xl mx-auto px-6 py-8">
        
        <!-- Add Task Form -->
        <div class="bg-white dark:bg-zinc-900 rounded-3xl modern-shadow border border-zinc-200 dark:border-zinc-800 p-6 mb-8">
            <div class="flex items-center gap-x-3 mb-4">
                <div class="w-8 h-8 flex items-center justify-center bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 rounded-2xl">
                    <i class="fa-solid fa-plus text-lg"></i>
                </div>
                <h2 class="section-header">Новая задача</h2>
            </div>
            
            <form id="add-task-form" class="grid grid-cols-1 md:grid-cols-12 gap-3">
                <!-- Task text -->
                <div class="md:col-span-4">
                    <input type="text" id="task-text" 
                           class="w-full px-4 py-3.5 bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:border-indigo-400 rounded-2xl text-zinc-800 dark:text-zinc-100 placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-indigo-100 dark:focus:ring-indigo-900/50 transition-all"
                           placeholder="Что нужно сделать?" required>
                </div>
                
                <!-- Due date -->
                <div class="md:col-span-2">
                    <div class="relative">
                        <input type="date" id="task-due-date" 
                               class="w-full px-4 py-3.5 bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:border-indigo-400 rounded-2xl text-zinc-700 dark:text-zinc-300 focus:outline-none focus:ring-2 focus:ring-indigo-100 transition-all">
                    </div>
                </div>
                
                <!-- Priority -->
                <div class="md:col-span-2">
                    <select id="task-priority" 
                            class="w-full px-4 py-3.5 bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:border-indigo-400 rounded-2xl text-zinc-700 dark:text-zinc-300 focus:outline-none focus:ring-2 focus:ring-indigo-100 transition-all">
                        <option value="low">Низкий приоритет</option>
                        <option value="medium" selected>Средний приоритет</option>
                        <option value="high">Высокий приоритет</option>
                    </select>
                </div>

                <!-- Tags -->
                <div class="md:col-span-2">
                    <input type="text" id="task-tags" 
                           class="w-full px-4 py-3.5 bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:border-indigo-400 rounded-2xl text-zinc-700 dark:text-zinc-300 placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-indigo-100 transition-all"
                           placeholder="Теги (через запятую)">
                </div>
                
                <!-- Add button -->
                <div class="md:col-span-2">
                    <button type="submit" 
                            class="w-full h-full flex items-center justify-center gap-x-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 transition-all text-white font-semibold px-6 py-3.5 rounded-2xl shadow-lg shadow-indigo-200 dark:shadow-none">
                        <i class="fa-solid fa-plus"></i>
                        <span>Добавить</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Filters & Search -->
        <div class="flex flex-col lg:flex-row gap-4 items-center justify-between mb-6">
            <!-- Search -->
            <div class="relative w-full lg:w-96">
                <div class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400">
                    <i class="fa-solid fa-search"></i>
                </div>
                <input type="text" id="search-input" 
                       class="w-full pl-11 pr-4 py-3 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 focus:border-indigo-300 rounded-2xl text-sm placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-indigo-100 transition-all"
                       placeholder="Поиск по задачам или тегам...">
            </div>
            
            <!-- Filter buttons -->
            <div class="flex items-center bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-3xl p-1 shadow-sm w-full lg:w-auto">
                <button onclick="setFilter('all')" id="filter-all"
                        class="filter-btn active flex-1 lg:flex-none px-6 py-2 text-sm font-medium rounded-[22px] flex items-center justify-center gap-x-2">
                    <span>Все</span>
                    <span id="count-all" class="bg-zinc-200 dark:bg-zinc-700 text-zinc-600 dark:text-zinc-300 text-xs font-mono px-2 py-px rounded-full">0</span>
                </button>
                <button onclick="setFilter('active')" id="filter-active"
                        class="filter-btn flex-1 lg:flex-none px-6 py-2 text-sm font-medium rounded-[22px] flex items-center justify-center gap-x-2 text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white">
                    <span>Активные</span>
                    <span id="count-active" class="bg-emerald-100 dark:bg-emerald-900/50 text-emerald-600 dark:text-emerald-400 text-xs font-mono px-2 py-px rounded-full">0</span>
                </button>
                <button onclick="setFilter('completed')" id="filter-completed"
                        class="filter-btn flex-1 lg:flex-none px-6 py-2 text-sm font-medium rounded-[22px] flex items-center justify-center gap-x-2 text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white">
                    <span>Выполненные</span>
                    <span id="count-completed" class="bg-zinc-200 dark:bg-zinc-700 text-zinc-600 dark:text-zinc-300 text-xs font-mono px-2 py-px rounded-full">0</span>
                </button>
            </div>
        </div>

        <!-- Task List -->
        <div id="task-list" class="space-y-3 min-h-[380px]">
            <!-- Tasks rendered by JS -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-14 text-center">
            <div class="w-20 h-20 bg-zinc-100 dark:bg-zinc-800 rounded-full flex items-center justify-center mb-5">
                <i class="fa-solid fa-inbox text-4xl text-zinc-300 dark:text-zinc-600"></i>
            </div>
            <h3 class="font-semibold text-xl text-zinc-700 dark:text-zinc-200">Задач пока нет</h3>
            <p class="text-zinc-500 dark:text-zinc-400 mt-1 max-w-xs">Добавьте первую задачу, чтобы начать отслеживать прогресс</p>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-black/60 dark:bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="modal bg-white dark:bg-zinc-900 rounded-3xl w-full max-w-md shadow-2xl border border-zinc-100 dark:border-zinc-700">
            <!-- Modal Header -->
            <div class="px-6 pt-6 pb-4 flex items-center justify-between border-b dark:border-zinc-700">
                <div>
                    <h3 class="font-semibold text-xl">Редактировать задачу</h3>
                </div>
                <button onclick="closeEditModal()" class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 w-9 h-9 flex items-center justify-center rounded-2xl hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">
                    <i class="fa-solid fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="p-6 space-y-5">
                <!-- Edit Text -->
                <div>
                    <label class="block text-xs font-semibold text-zinc-500 dark:text-zinc-400 mb-1.5 tracking-wider">ОПИСАНИЕ ЗАДАЧИ</label>
                    <input type="text" id="edit-text" 
                           class="w-full px-4 py-3 border border-zinc-200 dark:border-zinc-700 focus:border-indigo-400 rounded-2xl bg-white dark:bg-zinc-800 text-zinc-800 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-indigo-100">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <!-- Edit Due Date -->
                    <div>
                        <label class="block text-xs font-semibold text-zinc-500 dark:text-zinc-400 mb-1.5 tracking-wider">СРОК ВЫПОЛНЕНИЯ</label>
                        <input type="date" id="edit-due-date" 
                               class="w-full px-4 py-3 border border-zinc-200 dark:border-zinc-700 focus:border-indigo-400 rounded-2xl bg-white dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 focus:outline-none focus:ring-2 focus:ring-indigo-100">
                    </div>
                    
                    <!-- Edit Priority -->
                    <div>
                        <label class="block text-xs font-semibold text-zinc-500 dark:text-zinc-400 mb-1.5 tracking-wider">ПРИОРИТЕТ</label>
                        <select id="edit-priority" 
                                class="w-full px-4 py-3 border border-zinc-200 dark:border-zinc-700 focus:border-indigo-400 rounded-2xl bg-white dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 focus:outline-none focus:ring-2 focus:ring-indigo-100">
                            <option value="low">Низкий</option>
                            <option value="medium">Средний</option>
                            <option value="high">Высокий</option>
                        </select>
                    </div>
                </div>

                <!-- Edit Tags -->
                <div>
                    <label class="block text-xs font-semibold text-zinc-500 dark:text-zinc-400 mb-1.5 tracking-wider">ТЕГИ (через запятую)</label>
                    <input type="text" id="edit-tags" 
                           class="w-full px-4 py-3 border border-zinc-200 dark:border-zinc-700 focus:border-indigo-400 rounded-2xl bg-white dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 focus:outline-none focus:ring-2 focus:ring-indigo-100"
                           placeholder="работа, личное, важное">
                </div>
            </div>
            
            <!-- Modal Actions -->
            <div class="px-6 py-5 bg-zinc-50 dark:bg-zinc-800 rounded-b-3xl flex gap-3">
                <button onclick="closeEditModal()" 
                        class="flex-1 py-3 text-sm font-semibold text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition-colors rounded-2xl border border-zinc-200 dark:border-zinc-600">
                    Отмена
                </button>
                <button onclick="saveEditedTask()" 
                        class="flex-1 py-3 text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white transition-colors rounded-2xl">
                    Сохранить изменения
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
